<script>
      (function () {
  "use strict";

  var tl = gsap.timeline({ paused: true });

  var rail = document.getElementById("hf04-rail");
  var card = document.getElementById("hf04-card");
  var hl = document.getElementById("hf04-hl");
  var sb = document.getElementById("hf04-sb");
  var capture = document.getElementById("hf04-capture");
  var hopline = document.getElementById("hf04-hopline");
  var check = document.getElementById("hf04-check-i1");

  var checkLen = check.getTotalLength() + 1;
  check.style.strokeDasharray = checkLen + "px";
  check.style.strokeDashoffset = checkLen + "px";

  var dash = { o: 0 };
  function writeDash() {
    hopline.setAttribute("stroke-dashoffset", dash.o);
  }
  writeDash();

  // progress strip: opens where frame 3 closed (37.5%) and eases up to the 50% mark
  tl.fromTo("#hf04-fill", { scaleX: 0.75 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.08);

  // Scene 1 (0.0-1.0s): the board card arrives tilted (rotateY -8, rotateX 4) and settles
  // flat in 3D; rail + headline seat left; the captured board rides behind at low emphasis
  tl.fromTo(rail, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.02);
  tl.fromTo(
    card,
    { opacity: 0, y: -34, scale: 0.965, rotationY: -8, rotationX: 4, transformPerspective: 1500 },
    { opacity: 1, y: 0, scale: 1, rotationY: 0, rotationX: 0, duration: 0.8, ease: "power3.out" },
    0.05
  );
  tl.fromTo(hl, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.16);

  // Scene 2 (1.0-2.9s): the hop path appears; the captured board wakes; three quick hops,
  // one per beat, each landing with a soft 3D dip-settle; pills flip as the state changes
  tl.fromTo(hopline, { opacity: 0 }, { opacity: 0.55, duration: 0.4, ease: "power2.out" }, 0.85);
  tl.fromTo(capture, { opacity: 0.55 }, { opacity: 0.7, duration: 0.5, ease: "power2.inOut" }, 1.0);

  function hop(id, dx, dy, T) {
    var chip = "#hf04-chip-" + id;
    tl.fromTo(
      chip,
      { y: 0, scale: 1, rotationX: 0, transformPerspective: 700 },
      { y: -30, scale: 1.05, rotationX: -9, duration: 0.12, ease: "power2.out" },
      T
    );
    tl.fromTo(chip, { x: 0 }, { x: dx, duration: 0.24, ease: "power2.inOut" }, T + 0.1);
    tl.fromTo(
      chip,
      { y: -30, scale: 1.05, rotationX: -9 },
      { y: dy, scale: 1, rotationX: 0, duration: 0.26, ease: "power3.out", immediateRender: false },
      T + 0.32
    );
  }

  function railPulse(base, T) {
    tl.fromTo(dash, { o: base }, { o: base - 42, duration: 0.55, ease: "power1.inOut", onUpdate: writeDash, immediateRender: false }, T);
    tl.fromTo(hopline, { opacity: 0.55 }, { opacity: 0.9, duration: 0.12, ease: "power1.out", immediateRender: false }, T + 0.12);
    tl.fromTo(hopline, { opacity: 0.9 }, { opacity: 0.55, duration: 0.34, ease: "power1.out", immediateRender: false }, T + 0.24);
  }

  function flipActive(id, T) {
    tl.fromTo(
      "#hf04-pill-" + id,
      { backgroundColor: "rgba(11,74,111,0.04)", borderColor: "rgba(11,74,111,0.28)" },
      { backgroundColor: "rgba(11,74,111,0.08)", borderColor: "rgba(11,74,111,0.5)", duration: 0.22, ease: "power2.out" },
      T
    );
    tl.fromTo(
      "#hf04-dot-" + id,
      { backgroundColor: "rgba(11,74,111,0)", borderColor: "rgba(11,74,111,0.45)" },
      { backgroundColor: "#0B4A6F", borderColor: "#0B4A6F", duration: 0.22, ease: "power2.out" },
      T
    );
    tl.fromTo("#hf04-dot-" + id, { scale: 1 }, { scale: 1.35, duration: 0.11, ease: "power2.out" }, T);
    tl.fromTo("#hf04-dot-" + id, { scale: 1.35 }, { scale: 1, duration: 0.24, ease: "power3.out", immediateRender: false }, T + 0.11);
  }

  function flipDone(T) {
    tl.fromTo(
      "#hf04-pill-i1",
      { backgroundColor: "rgba(11,74,111,0.08)", borderColor: "rgba(11,74,111,0.5)" },
      { backgroundColor: "#0B4A6F", borderColor: "#0B4A6F", duration: 0.22, ease: "power2.out" },
      T
    );
    tl.fromTo("#hf04-dot-i1", { scale: 1, opacity: 1 }, { scale: 0, opacity: 0, duration: 0.16, ease: "power2.in" }, T);
    tl.fromTo("#hf04-check-i1", { strokeDashoffset: checkLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" }, T + 0.04);
  }

  // hop 1 (beat 1.0): Planned -> In Progress; pill flips active as it touches down
  hop("p2", 332.44, 0, 1.0);
  railPulse(0, 1.04);
  flipActive("p2", 1.5);

  // after hop one lands: the subline fades up under the headline
  tl.fromTo(sb, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.6);

  // hop 2 (beat 1.6): In Progress -> Done; pill flips to a filled check
  hop("i1", 332.44, 96.36, 1.6);
  railPulse(-42, 1.64);
  flipDone(2.1);

  // hop 3 (beat 2.2): the second Planned chip follows into In Progress
  hop("p3", 332.44, 0, 2.2);
  railPulse(-84, 2.24);
  flipActive("p3", 2.66);

  // Scene 3 (2.9-3.70s): the advanced board holds — still

  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["04-boards-moved"] = tl;
})();
</script>
