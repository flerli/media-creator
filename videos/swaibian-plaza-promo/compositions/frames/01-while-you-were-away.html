<div data-hf-id="hf-x8ce" id="root" data-composition-id="01-while-you-were-away" data-width="1920" data-height="1080" data-duration="3.64">
  <div data-hf-id="hf-z5js" id="01-while-you-were-away-bg" class="clip f01-bg" data-start="0" data-duration="3.64" data-track-index="0"></div>

  <div data-hf-id="hf-md25" id="01-while-you-were-away-scene" class="clip f01-scene" data-start="0" data-duration="3.64" data-track-index="1">
    <div data-hf-id="hf-ndkt" id="01-while-you-were-away-rail" class="f01-rail"><i data-hf-id="hf-5ucq" id="01-while-you-were-away-rail-dot"></i><span data-hf-id="hf-azdt">Donna's Dispatch</span></div>
    <div data-hf-id="hf-1stg" id="01-while-you-were-away-stage" class="f01-stage">
      <div data-hf-id="hf-50bl" id="01-while-you-were-away-line" class="f01-line">
        <span data-hf-id="hf-48tp" class="f01-measure" aria-hidden="true">While you were out&#160;—<i data-hf-id="hf-306p" class="f01-caret"></i></span>
        <span data-hf-id="hf-7mg7" class="f01-live"><span data-hf-id="hf-ndls" id="01-while-you-were-away-text"></span><i data-hf-id="hf-9jlb" id="01-while-you-were-away-caret" class="f01-caret"></i></span>
      </div>
    </div>
  </div>

  <div data-hf-id="hf-gpgi" id="01-while-you-were-away-strip" class="clip f01-strip" data-start="0" data-duration="3.64" data-track-index="2">
    <i data-hf-id="hf-oilr" id="01-while-you-were-away-fill"></i>
  </div>

  <script>
    (function () {
      "use strict";

      // Deterministic constants — no clocks, no randomness.
      var DURATION = 3.24;
      var PREFIX = "While you were out";
      var FULL = "While you were out\u00A0\u2014";
      var TYPE_START = 0.4;      // caret blinks alone at the line's start first
      var CHAR_STEP = 0.075;     // fast keystroke cluster spacing
      var WORD_STEP = 0.15;      // short breath at word breaks
      var DASH_T = 2.05;         // the em-dash lands (typing spans 0.4 -> 1.9, ~1.5s)
      var BLINK_STOP = 2.6;      // Scene 3 begins: the held read — caret solid, nothing moves
      var BLINK_PERIOD = 0.65;   // 4 whole blink cycles across 0 -> BLINK_STOP
      var BLINK_PHASE = Math.PI / 2; // visible at t=0 and again exactly at BLINK_STOP
      var TYPE_GRACE = 0.25;     // caret stays solid within this window of a keystroke

      // Discrete text sequence (discrete-text-sequence): whole-string states at frame thresholds.
      var SEQUENCE = [{ t: 0, text: "" }];
      var t = TYPE_START;
      SEQUENCE.push({ t: t, text: PREFIX.slice(0, 1) });
      for (var i = 1; i < PREFIX.length; i++) {
        t += PREFIX.charAt(i - 1) === " " ? WORD_STEP : CHAR_STEP;
        SEQUENCE.push({ t: t, text: PREFIX.slice(0, i + 1) });
      }
      SEQUENCE.push({ t: DASH_T, text: FULL });

      // Baked typing events — pure function of the sequence, seek-safe in both directions.
      var CHANGE_TIMES = [];
      for (var c = 1; c < SEQUENCE.length; c++) {
        if (SEQUENCE[c].text !== SEQUENCE[c - 1].text) CHANGE_TIMES.push(SEQUENCE[c].t);
      }

      function textAt(time) {
        for (var k = SEQUENCE.length - 1; k >= 0; k--) {
          if (time >= SEQUENCE[k].t) return SEQUENCE[k].text;
        }
        return "";
      }

      // Context-sensitive caret: petrol block; solid while typing (grace window), deterministic
      // sin square-wave blink on idle, solid through the held read.
      function caretVisible(time) {
        if (time >= BLINK_STOP) return true;
        for (var m = 0; m < CHANGE_TIMES.length; m++) {
          if (time >= CHANGE_TIMES[m] && time - CHANGE_TIMES[m] < TYPE_GRACE) return true;
        }
        return Math.sin((time / BLINK_PERIOD) * Math.PI * 2 + BLINK_PHASE) > 0;
      }

      var textEl = document.getElementById("01-while-you-were-away-text");
      var caretEl = document.getElementById("01-while-you-were-away-caret");
      var railEl = document.getElementById("01-while-you-were-away-rail");
      var lineEl = document.getElementById("01-while-you-were-away-line");
      var fillEl = document.getElementById("01-while-you-were-away-fill");

      textEl.textContent = "";
      caretEl.style.opacity = "1";

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-1.9s): warm paper; the rail seats top-left; the strip fills its first eighth;
      // the caret blinks at the line's start, then "While you were out" types on fast (~1.5s)
      // while the line plane settles from a slight 3D tilt down onto the paper.
      tl.fromTo(lineEl, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, 0);
      tl.fromTo(lineEl,
        { rotationX: 9, transformPerspective: 1400, transformOrigin: "50% 100%" },
        { rotationX: 0, duration: 2.05, ease: "power2.out" }, 0);
      tl.fromTo(railEl,
        { opacity: 0, y: -10, rotationX: -8, transformPerspective: 900, transformOrigin: "50% 0%" },
        { opacity: 1, y: 0, rotationX: 0, duration: 0.45, ease: "power2.out" }, 0.04);
      tl.fromTo(fillEl, { scaleX: 0 }, { scaleX: 0.125, duration: 0.55, ease: "power2.out" }, 0.06);

      // Scenes 1-3 clock: discrete type-on + trailing caret blink, then frozen after the dash.
      var clock = { t: 0 };
      tl.to(clock, {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: function () {
          textEl.textContent = textAt(clock.t);
          caretEl.style.opacity = caretVisible(clock.t) ? "1" : "0";
        }
      }, 0);

      // Scene 2 (1.9-2.6s): the em-dash lands at 2.05; the line is flat on the paper; the caret
      // keeps blinking until 2.6. Scene 3 (2.6-3.24s): the held read — nothing moves at all.
      // No exit motion (the seam owns the exit).

      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["01-while-you-were-away"] = tl;
    })();
  </script>
