<script>
(function () {
  "use strict";

  var tl = gsap.timeline({ paused: true });

  // Scene 1 (0.0-1.2s): the full-bleed Metro starts on a gentle 3D lean and settles flat as the
  // scene opens; chip, headline and subline seat bottom-left over the scrim.
  tl.fromTo(
    "#f03-panel",
    { rotateY: 5, transformPerspective: 1500 },
    { rotateY: 0, transformPerspective: 1500, duration: 1.1, ease: "power3.out" },
    0
  );
  tl.fromTo("#f03-fill", { scaleX: 0.25 }, { scaleX: 0.375, duration: 0.55, ease: "power2.out" }, 0.06);
  tl.fromTo("#f03-rail", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
  tl.fromTo("#f03-hl", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.2);
  tl.fromTo("#f03-sb", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.5);

  // Camera (viewport-change): one world wrapper, one camera-state writer. The world is the capture
  // at cover+1.2x, so all offsets are measured from the world center, which sits on frame center.
  var world = document.getElementById("f03-world");
  var cam = { x: 0, y: 0, scale: 1 };
  function applyCamera() {
    world.style.transform = "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.scale + ")";
  }
  applyCamera();

  // Pulse (svg-icon-enrichment): dash flow along the captured connector chain + a travelling head.
  var route = document.getElementById("f03-route");
  var head = document.getElementById("f03-head");
  var ripple = document.getElementById("f03-ripple");
  var routeLen = route.getTotalLength();
  var pulse = { p: 0 };
  var headState = { s: 0.5, o: 0 };
  function writeHead() {
    var pt = route.getPointAtLength(pulse.p * routeLen);
    head.setAttribute("transform", "translate(" + pt.x + " " + pt.y + ") scale(" + headState.s + ")");
    head.style.opacity = String(headState.o);
  }
  writeHead();
  var flow = { off: 0 };
  function writeFlow() { route.style.strokeDashoffset = String(flow.off); }
  writeFlow();
  var rip = { r: 30, o: 0 };
  function writeRipple() {
    ripple.setAttribute("r", String(rip.r));
    ripple.setAttribute("opacity", String(rip.o));
  }
  writeRipple();

  // Scene 2 (1.2-2.6s): the pulse ignites at the Trigger node and runs the captured connector
  // chain rightward (dash flow); the camera eases laterally with it and decelerates.
  tl.fromTo(route, { opacity: 0 }, { opacity: 0.8, duration: 0.28, ease: "power1.out" }, 1.22);
  tl.fromTo(headState, { o: 0 }, { o: 1, duration: 0.22, ease: "power2.out", onUpdate: writeHead }, 1.22);
  tl.to(headState, { s: 1.3, duration: 0.16, ease: "power2.out", onUpdate: writeHead }, 1.22);
  tl.to(headState, { s: 1, duration: 0.2, ease: "power2.inOut", onUpdate: writeHead }, 1.38);
  tl.to(pulse, { p: 0.6807, duration: 1.15, ease: "power1.inOut", onUpdate: writeHead }, 1.3);
  tl.to(flow, { off: -1152, duration: 1.53, ease: "none", onUpdate: writeFlow }, 1.3);
  tl.to(cam, { x: -150, duration: 1.44, ease: "power2.out", onUpdate: applyCamera }, 1.28);

  // Scene 3 (2.6-3.70s): the pulse drops from the chain onto the Swaiboard region and dissipates;
  // the camera settles; locked hold.
  tl.to(pulse, { p: 1, duration: 0.38, ease: "power2.inOut", onUpdate: writeHead }, 2.45);
  tl.fromTo(rip, { r: 30, o: 0 }, { r: 44, o: 0.55, duration: 0.08, ease: "none", onUpdate: writeRipple }, 2.83);
  tl.to(headState, { s: 2, o: 0, duration: 0.34, ease: "power2.out", onUpdate: writeHead }, 2.83);
  tl.to(rip, { r: 240, o: 0, duration: 0.4, ease: "power2.out", onUpdate: writeRipple }, 2.91);
  tl.to(route, { opacity: 0.28, duration: 0.36, ease: "power1.out" }, 2.88);

  // Dispatch pill: alive — status types on, the dot pulses
  var railText = document.getElementById("f03-rail-text");
  var RAIL = [
    { t: 0, s: "DONNA'S DISPATCH" },
    { t: 1.5, s: "DONNA'S DISPATCH · PIPELINES RAN" },
  ];
  var TYPE_DUR = 0.55;
  function railTextAt(v) {
    var out = "";
    for (var i = 0; i < RAIL.length; i++) {
      var st = RAIL[i];
      if (v < st.t) break;
      var prevLen = i === 0 ? 0 : RAIL[i - 1].s.length;
      var p = Math.min(1, (v - st.t) / TYPE_DUR);
      var n = prevLen + Math.round((st.s.length - prevLen) * p);
      out = st.s.slice(0, n);
      if (p < 1) break;
    }
    return out;
  }
  var rail = { p: 0 };
  tl.to(rail, { p: 3.7, duration: 3.7, ease: "none", onUpdate: function () {
    var s2 = railTextAt(rail.p);
    if (railText.textContent !== s2) railText.textContent = s2;
  } }, 0);

  tl.to("#f03-rail-dot", { scale: 1, duration: 0.18, ease: "power2.inOut" }, 1.74);
