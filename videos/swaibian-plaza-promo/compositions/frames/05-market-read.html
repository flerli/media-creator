      @font-face{font-family:"Neue Haas Grotesk Text Pro";font-style:normal;font-weight:100;font-display:block;src:url("assets/fonts/captured-NeueHaasDisplay-XXThin.woff") format("woff")}
      @font-face{font-family:"Neue Haas Grotesk Text Pro";font-style:normal;font-weight:200;font-display:block;src:url("assets/fonts/captured-NeueHaasDisplay-XThin.woff") format("woff")}
      @font-face{font-family:"Neue Haas Grotesk Text Pro";font-style:normal;font-weight:300;font-display:block;src:url("assets/fonts/captured-NeueHaasDisplay-Thin.woff") format("woff")}

      #root {
        position: absolute;
        inset: 0;

      #f05-stage {

      #f05-media {
        position: absolute;

      #f05-outer {
        position: absolute;

    <div data-hf-id="hf-05bg" id="f05-bg" class="clip" data-start="0" data-duration="5.25" data-track-index="0"></div>

    <div data-hf-id="hf-05st" id="f05-stage" class="clip" data-start="0" data-duration="5.25" data-track-index="1">
      <div data-hf-id="hf-05md" id="f05-media" role="img" aria-label="Donna's Dispatch canvas — market digest and one-year chart">
        <div data-hf-id="hf-05o" id="f05-outer" data-layout-allow-overflow>
          <div data-hf-id="hf-05i" id="f05-inner">
            <img data-hf-id="hf-05img" id="f05-img" src="assets/plaza-donna-dispatch-canvas.png" alt="">

      <div data-hf-id="hf-05dk" id="f05-dusk"></div>

      <div data-hf-id="hf-05rl" id="f05-rail"><i data-hf-id="hf-05rd"></i><span data-hf-id="hf-05rt" id="f05-rail-text">DONNA'S DISPATCH</span></div>
      <div data-hf-id="hf-05cp" id="f05-copy">
        <div data-hf-id="hf-05t" class="t">I read the market for you.</div>

      </div>

    <div data-hf-id="hf-05pg" id="f05-progress" class="clip" data-start="0" data-duration="5.25" data-track-index="2">
      <span data-hf-id="hf-05fl" id="f05-fill"></span>
    </div>

    <script>
      (function () {
        "use strict";

        var tl = gsap.timeline({ paused: true });

        // Full-bleed z-depth push: outer scales (with a slight rotateY bank), inner
        // counter-translates so the chart card lands at frame center (coordinate-target-zoom,
        // nested wrappers: T = -offset, measured once at setup and baked).
        var SRC_W = 7680;
        var SRC_H = 3276;
        var CHART_X = 6811; // chart-card center in source px
        var CHART_Y = 1307;
        var PUSH_SCALE = 1.8;

        var rootRect = document.getElementById("root").getBoundingClientRect();
        var k = rootRect.width / 1920 || 1; // normalize to local canvas units
        var W = rootRect.width / k;
        var H = rootRect.height / k;

        var cover = Math.max(W / SRC_W, H / SRC_H);
        var dispW = SRC_W * cover;
        var offX = (dispW - W) * 1.0; // object-position-x: 100%
        var px = CHART_X * cover - offX;
        var py = CHART_Y * cover;
        var tx = -(px - W / 2);
        var ty = -(py - H / 2);

        var outer = document.getElementById("f05-outer");
        var inner = document.getElementById("f05-inner");

        tl.fromTo(
          "#f05-fill",
          { scaleX: 0.5 },
          { scaleX: 0.625, duration: 0.5, ease: "power2.out" },
          0.06
        );

        tl.fromTo(
          "#f05-dusk",
          { opacity: 1 },
          { opacity: 0, duration: 1.2, ease: "power2.out" },
          1.2
        );

        tl.fromTo(
          outer,
          { scale: 1, rotationY: 0, transformPerspective: 1200 },
          { scale: PUSH_SCALE, rotationY: 2, duration: 2.2, ease: "power3.inOut" },
          1.2
        );

        tl.fromTo(
          inner,
          { x: 0, y: 0 },
          { x: tx, y: ty, duration: 2.2, ease: "power3.inOut" },
          1.2
        );

        // Dispatch pill: alive — status types on, the dot pulses
        var railText = document.getElementById("f05-rail-text");
        var RAIL = [
          { t: 0, s: "DONNA'S DISPATCH" },
          { t: 3.4, s: "DONNA'S DISPATCH · MARKET READ" },
        ];
        var TYPE_DUR = 0.55;
        function railTextAt(v) {
          var out = "";
          for (var i = 0; i < RAIL.length; i++) {
            var st = RAIL[i];
            if (v < st.t) break;
            var prevLen = i === 0 ? 0 : RAIL[i - 1].s.length;
            var p = Math.min(1, (v - st.t) / TYPE_DUR);
            var n = prevLen + Math.round((st.s.length - prevLen) * p);
            out = st.s.slice(0, n);
            if (p < 1) break;
          }
          return out;
        }
        var rail = { p: 0 };
        tl.to(rail, { p: 4.75, duration: 4.75, ease: "none", onUpdate: function () {
          var s2 = railTextAt(rail.p);
          if (railText.textContent !== s2) railText.textContent = s2;
        } }, 0);
        tl.fromTo("#f05-rail i", { scale: 1 }, { scale: 1.35, duration: 0.16, ease: "power2.out" }, 3.48);
        tl.to("#f05-rail i", { scale: 1, duration: 0.18, ease: "power2.inOut" }, 3.64);
        tl.fromTo("#f05-rail i", { scale: 1 }, { scale: 1.28, duration: 0.14, ease: "power2.out" }, 3.84);
        tl.to("#f05-rail i", { scale: 1, duration: 0.35, ease: "power2.inOut" }, 3.98);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["05-market-read"] = tl;
      })();
    </script>
